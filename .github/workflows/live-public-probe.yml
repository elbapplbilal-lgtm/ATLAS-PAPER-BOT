name: ATLAS LIVE public connectivity (NO KEYS)
on:
  push:
    paths:
      - '.github/workflows/live-public-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Binance LIVE public time only - no keys, no orders
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          url = "https://fapi.binance.com/fapi/v1/time"
          req = urllib.request.Request(url, headers={"User-Agent": "ATLAS-PUBLIC-PROBE/1.0"}, method="GET")
          try:
              with urllib.request.urlopen(req, timeout=12) as response:
                  obj = json.load(response)
                  if response.status == 200 and isinstance(obj.get("serverTime"), int):
                      print("ATLAS LIVE PUBLIC: ACCESSIBLE, HTTP 200")
                  else:
                      print("ATLAS LIVE PUBLIC: INVALID RESPONSE")
          except urllib.error.HTTPError as e:
              print("ATLAS LIVE PUBLIC: NOT ACCESSIBLE, HTTP", e.code)
          except (urllib.error.URLError, OSError, ValueError) as e:
              print("ATLAS LIVE PUBLIC: CONNECTION ERROR", type(e).__name__)
          print("READ ONLY PUBLIC ENDPOINT. NO CREDENTIALS. NO ORDERS.")
          PY
